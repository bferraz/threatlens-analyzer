version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: threatlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threatlens
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - threatlens-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatlens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=threatlens
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-5.2}
      - OPENAI_TEXT_MODEL=${OPENAI_TEXT_MODEL:-gpt-5}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/reports:/app/reports
    networks:
      - threatlens-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: threatlens-frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - backend
    networks:
      - threatlens-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  threatlens-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
